name: Build e deploy

on:
  push:
    branches: [main]
  schedule:
    # Every day at 09:15 UTC (06:15 in Brasília): refresh Central Bank data and rebuild.
    - cron: '15 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Atualizar índices do Banco Central
        if: github.event_name != 'push'
        run: npm run update:indices

      - name: Testes (cálculos, tabelas vigentes, validações e todas as calculadoras)
        run: npm test

      - name: Build
        run: npm run build
        env:
          RECIBADOR_GA_ID: ${{ vars.RECIBADOR_GA_ID }}
          RECIBADOR_ADSENSE_CLIENT: ${{ vars.RECIBADOR_ADSENSE_CLIENT }}
          RECIBADOR_AD_SLOT_RESULT: ${{ vars.RECIBADOR_AD_SLOT_RESULT }}
          RECIBADOR_AD_SLOT_CONTENT: ${{ vars.RECIBADOR_AD_SLOT_CONTENT }}
          RECIBADOR_AD_SLOT_SIDEBAR: ${{ vars.RECIBADOR_AD_SLOT_SIDEBAR }}

      - name: Validar site (links, SEO, sitemap)
        run: npm run validate

      - name: Salvar índices atualizados no repositório
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- src/data; then
            git config user.name "recibador-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/data/indices.json src/data/rates.json
            git commit -m "Update Central Bank indices"
            git push
          fi

      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
